<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- viewport: makes the page fit a phone screen; viewport-fit=cover uses the whole iPhone screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teo's Workout Planner</title>

  <!-- Makes the app installable and full-screen on phones -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1d3557">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- app.js draws every screen inside this one element -->
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
